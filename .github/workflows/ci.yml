name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ============================================================================
  # 1. Backend Testing & Code Quality
  # ============================================================================
  test-backend:
    name: 🐍 Test & Lint Backend (Flask)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: 🔍 Lint with Flake8 (Syntax & Undefined Names)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Run Pytest Test Suite
        env:
          SECRET_KEY: ci_super_secret_test_key_32_bytes_long_2026
          JWT_SECRET_KEY: ci_super_secure_jwt_secret_key_32_bytes_long_2026
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest backend/tests -v

  # ============================================================================
  # 2. Docker Images Build Validation
  # ============================================================================
  build-docker-images:
    name: 🐳 Validate Docker Builds
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Test Build Frontend Image (Nginx)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: police-frontend:test

      - name: 🔨 Test Build Backend Image (Flask)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: police-backend:test

      - name: 📋 Validate Docker Compose Configuration
        run: |
          docker compose config
