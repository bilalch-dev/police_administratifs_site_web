name: "Continuous Integration & Container Registry (CI/CD)"

on:
  push:
    branches: ["main", "master", "develop"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "master", "develop"]

# Permissions required to publish packages to GitHub Container Registry (ghcr.io)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/police-frontend
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/police-backend

jobs:
  # ============================================================================
  # 1. Backend Testing & Code Quality
  # ============================================================================
  test-backend:
    name: "Test and Lint Backend (Flask)"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: "Lint with Flake8"
        run: |
          # Stop build if there are syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings check with standard line length
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "Run Pytest Test Suite"
        env:
          SECRET_KEY: "ci_super_secret_test_key_32_bytes_long_2026"
          JWT_SECRET_KEY: "ci_super_secure_jwt_secret_key_32_bytes_long_2026"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest backend/tests -v

  # ============================================================================
  # 2. Build & Publish Docker Images to GHCR
  # ============================================================================
  build-and-publish:
    name: "Build and Publish Docker Images to GHCR"
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GitHub Container Registry"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend Image Tags & Build ---
      - name: "Extract Docker Metadata for Frontend"
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: "Build and Push Frontend Image (Nginx)"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Backend Image Tags & Build ---
      - name: "Extract Docker Metadata for Backend"
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: "Build and Push Backend Image (Flask)"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Security Vulnerability Scan (Trivy)
  # ============================================================================
  security-scan:
    name: "Scan Docker Images for Vulnerabilities (Trivy)"
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build Backend Image Locally for Scanning"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: "police-backend:scan"

      - name: "Run Trivy Vulnerability Scanner on Backend"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "police-backend:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
