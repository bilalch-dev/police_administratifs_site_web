<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساطر والترخيصات الجماعية | الشرطة الإدارية</title>
    <meta name="description" content="دليل المساطر الإدارية، رخص احتلال الملك العمومي، المؤسسات المرتبة، رخص التعمير، وشرطة الجنائز والوقاية الصحية.">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        .procedure-tab-btn {
            padding: 0.65rem 1.4rem;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .procedure-tab-btn:hover, .procedure-tab-btn.active {
            background: var(--primary-light);
            color: #ffffff;
            border-color: var(--primary-light);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header id="main-header"></header>

    <!-- Main Content -->
    <main id="main-content">

        <!-- Page Header Banner -->
        <section class="hero-section" style="padding: 3rem 0; background: linear-gradient(135deg, rgba(13,148,136,0.08) 0%, rgba(59,130,246,0.05) 100%);">
            <div class="container">
                <div style="display:flex; align-items:center; gap:0.5rem; font-size:0.875rem; color:var(--text-light); margin-bottom:1rem;">
                    <a href="index.html">الرئيسية</a> <span>‹</span> <span style="color:var(--primary-light); font-weight:700;">المساطر والترخيصات</span>
                </div>
                
                <span class="section-tag">دليل الترخيص والمساطر</span>
                <h1 class="hero-title" style="font-size:2.5rem; margin-bottom:1rem;">
                    دليل المساطر والترخيصات الجماعية
                </h1>
                <p class="hero-description" style="max-width:850px; margin-bottom:0;">
                    دليل تفاعلي شامل لإيداع وتتبع طلبات رخص احتلال الملك العمومي، المؤسسات المرتبة، شواهد التعمير ورخص الدفن مع قائمة الوثائق المطلوبة لكل مسطرة.
                </p>
            </div>
        </section>

        <!-- Filter Tabs & Procedures Grid -->
        <section class="container" style="padding: 3.5rem 0; margin-bottom:3rem;">
            
            <!-- Filter Controls -->
            <div style="display:flex; justify-content:center; gap:0.75rem; flex-wrap:wrap; margin-bottom:3rem;">
                <button class="procedure-tab-btn active" onclick="filterProcedures('all', this)">📋 جميع المساطر (5)</button>
                <button class="procedure-tab-btn" onclick="filterProcedures('domain', this)">🎪 احتلال الملك العمومي</button>
                <button class="procedure-tab-btn" onclick="filterProcedures('establishments', this)">🏭 المؤسسات المرتبة</button>
                <button class="procedure-tab-btn" onclick="filterProcedures('building', this)">🏗️ التعمير والسكن</button>
                <button class="procedure-tab-btn" onclick="filterProcedures('health', this)">⚰️ الوقاية والجنائز</button>
                <button class="procedure-tab-btn" onclick="filterProcedures('execution', this)">⚡ التنفيذ التلقائي</button>
            </div>

            <!-- Procedures Grid Container -->
            <div id="procedures-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:2rem;">
                <!-- Cards rendered dynamically -->
            </div>

        </section>

    </main>

    <!-- Footer Component -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/procedures.js"></script>

</body>
</html>
